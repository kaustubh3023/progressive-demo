name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/progressive-demo:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/progressive-demo:${{ github.sha }}

      - name: Update GitOps Repository
        env:
          TOKEN: ${{ secrets.MANIFEST_REPO_TOKEN }}
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/progressive-demo:${{ github.sha }}
        run: |

          git clone https://x-access-token:${TOKEN}@github.com/kaustubh3023/progressive-demo-manifests.git

          cd progressive-demo-manifests

          sed -i "s|image:.*|image: ${IMAGE}|" rollout.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add rollout.yaml
          git commit -m "Update application image to ${GITHUB_SHA}" || echo "No changes"

          git push
